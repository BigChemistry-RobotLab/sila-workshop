services:
  jekyll:
    image: jekyll/jekyll
    volumes:
      - .:/srv/jekyll
      - jekyll_bundle:/usr/local/bundle
    ports:
      - "4000:4000"
    entrypoint: []
    command: >
      sh -c "bundle install &&
             bundle exec jekyll serve
             --host 0.0.0.0
             --force_polling
             --drafts
             --trace
             --watch
             --livereload"

volumes:
  jekyll_bundle:
